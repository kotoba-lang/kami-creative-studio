<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMI Creative Studio</title><style>body{margin:auto;max-width:900px;padding:28px;background:#0b1020;color:#e7ecf7;font:16px system-ui}section{background:#151d32;padding:20px;border-radius:14px;margin:16px 0}input,textarea,select,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #34405d;background:#0d1425;color:#e7ecf7}button{background:#70e0c3;color:#071015;font-weight:bold;cursor:pointer}code,pre{white-space:pre-wrap;word-break:break-word}.note{color:#aeb9d4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><body><h1>KAMI Creative Studio</h1><p class="note">Model → Rig → Motion と Music を、Murakumo job manifest に統合します。GPU資格情報は保存しません。</p><section><div class="grid"><label>Murakumo endpoint（任意）<input id="endpoint" placeholder="https://murakumo.cloud/api/gen"></label><label>Motion<select id="motion"><option>idle</option><option>walk</option><option>dance</option><option>gesture</option></select></label></div><label>Creative brief<textarea id="brief" rows="4" placeholder="例: 雨の東京を歩くVRMキャラクター、静かなシンセBGM"></textarea></label><label>Reference image / model CID（任意）<input id="ref" placeholder="bafy… または https://…"></label><button id="build">プロジェクトを設計</button><button id="submit">Endpoint へ送信</button></section><section><h2>統合プロジェクト</h2><pre id="out">入力するとここに CID-linked pipeline manifest を生成します。</pre></section><script>const $=id=>document.getElementById(id);let manifest;function build(){let prompt=$('brief').value.trim(),ref=$('ref').value.trim(),motion=$('motion').value;manifest={schema:'kami.creative-project/v1',brief:prompt,stages:[{id:'model',modality:'3d',model:'trellis',refs:ref?[ref]:[],requires:'remote-gpu-capability'},{id:'rig',modality:'rig',model:'unirig',from:'model',requires:'remote-gpu-capability'},{id:'motion',modality:'motion',model:'edn-motion-v1',from:'rig',params:{preset:motion,duration:2},requires:'mac-mini-control-worker'},{id:'music',modality:'music',model:'ace-step',prompt,requires:'remote-gpu-capability'}],policy:{no_silent_fallback:true,artifacts:'CID'}};$('out').textContent=JSON.stringify(manifest,null,2)}$('build').onclick=build;$('submit').onclick=async()=>{build();let url=$('endpoint').value.trim();if(!url)return alert('Endpoint を明示してください。offline manifest は上に表示済みです。');let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(manifest)});$('out').textContent=await r.text()};</script></body></html>
