name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Checkout capability compositor siblings
        run: |
          git clone --depth 1 https://github.com/kotoba-lang/kisekae.git ../kisekae
          git clone --depth 1 https://github.com/kotoba-lang/org-vrmc-vrm.git ../org-vrmc-vrm
          git clone --depth 1 https://github.com/kotoba-lang/org-khronos-glb.git ../org-khronos-glb
          git clone --depth 1 https://github.com/kotoba-lang/kotoba-lang.git ../kotoba-lang
      - run: npm ci
      - run: npm run release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
